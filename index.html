<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体育电视</title>
<style>
:root{--bg:#0d1420;--panel:#162132;--line:#24344d;--ink:#eef3fa;--dim:#9fb0c8;--accent:#ffb400}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px;min-height:100vh}
.side{display:flex;flex-direction:column;gap:12px}
h1{margin:0 0 4px;font-size:28px}
.hint{color:var(--dim);font-size:15px;margin:0}
.ch{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ch:hover,.ch:focus-visible{border-color:var(--dim);outline:none}
.ch.on{border-color:var(--accent);background:#2a2a1a}
.num{flex:none;width:52px;height:52px;border-radius:10px;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:20px}
.ch.on .num{background:var(--accent);color:#111}
.ch b{display:block;font-size:22px}
.ch small{color:var(--dim);font-size:15px}
.del{margin-left:auto;flex:none;background:none;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:8px}
.main{display:flex;flex-direction:column;gap:14px}
.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.screen>div,.screen iframe{position:absolute;inset:0;width:100%;height:100%}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:24px;color:var(--dim)}
.now{font-size:20px;min-height:30px}
.now span{color:var(--accent);font-weight:700;margin-right:10px}
.bar{display:flex;flex-wrap:wrap;gap:12px}
.btn{flex:1 1 140px;min-height:64px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.btn:hover,.btn:focus-visible{background:var(--line);outline:2px solid var(--dim)}
details{background:var(--panel);border-radius:14px;padding:12px 16px;font-size:16px}
summary{cursor:pointer;font-size:18px}
form{display:grid;gap:10px;margin-top:12px}
input{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:flex;gap:8px;align-items:center}
a{color:var(--accent)}
.ver{font-size:13px;opacity:.7}
h2{margin:6px 0 10px;font-size:22px}
.guide-wrap{grid-column:1/-1;order:3;background:var(--panel);border-radius:16px;padding:14px 16px}
.guide{overflow-x:auto;border-radius:10px}
.g-grid{min-width:860px;background:#0b1250}
.g-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid #2c3592;min-height:62px}
.g-head{min-height:44px;background:#06093a;border-bottom:2px solid #2c3592}
.g-ch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-right:1px solid #2c3592;background:#0e1660;color:var(--ink);font:inherit;cursor:pointer;padding:6px}
.g-ch b{color:var(--accent);font-size:22px;line-height:1}
.g-ch span{font-size:13px;letter-spacing:.04em}
.g-clock{font-size:20px;font-weight:700;cursor:default}
.g-track{position:relative;overflow:hidden}
.g-time{position:absolute;top:0;bottom:0;padding:10px 8px;border-left:1px solid #2c3592;font-size:15px;font-weight:700;white-space:nowrap}
.g-prog{position:absolute;top:0;bottom:0;border:0;border-right:1px solid #2c3592;background:#16206f;color:var(--ink);font:inherit;font-size:15px;text-align:left;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.g-prog:hover,.g-prog:focus-visible{background:#2a37a6;outline:none}
.g-prog.cur{color:var(--accent)}
.g-row.on{background:#2b3bb8;box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.g-row.on .g-prog{background:#2b3bb8}
.g-row.on .g-ch{background:#2b3bb8}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:#e3262b;pointer-events:none;z-index:2}
.g-wait{position:absolute;top:0;bottom:0;left:0;padding:0 10px;display:flex;align-items:center;color:var(--dim);font-size:14px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer;padding:4px 0}
@media(max-width:600px){.item{grid-template-columns:96px 1fr;font-size:16px}.item img{width:96px;height:54px}}
.resume{padding:22px 36px;border:0;border-radius:16px;background:var(--accent);color:#111;font:inherit;font-size:28px;font-weight:700;cursor:pointer}
.resume:focus-visible{outline:4px solid var(--ink)}
#probe{position:fixed;left:-10px;top:-10px;width:1px;height:1px;opacity:0;pointer-events:none}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.side{order:2}}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <div>
      <h1>体育电视</h1>
      <p class="hint">点一个频道就开始播放。键盘：↑↓ 换台，←→ 上一个/下一个，空格 暂停。</p>
    </div>
    <div id="list"></div>
    <details>
      <summary>添加频道</summary>
      <form id="addForm">
        <input id="addName" placeholder="频道名，例如：WTA 网球" required>
        <input id="addId" placeholder="频道 ID，以 UC 开头，共 24 位" required>
        <label><input type="checkbox" id="addAll"> 包含直播回放和短视频</label>
        <button class="btn" type="submit">添加</button>
        <div class="hint">不知道频道 ID？把频道网址贴到
          <a href="https://channelsurfer.tv/tools/youtube-channel-id" target="_blank" rel="noopener">这个查询工具</a> 里就能查到。</div>
        <div class="hint" id="addMsg"></div>
      </form>
    </details>
    <div class="hint" id="blockedInfo"></div>
    <p class="hint ver">版本 v0.10 · 2026-11-24</p>
  </div>

  <div class="main">
    <div class="screen" id="screen">
      <div id="player"></div>
      <div class="msg" id="msg">选一个频道开始</div>
    </div>
    <div class="now" id="now"></div>
    <div class="bar">
      <button class="btn" id="chDown">▲ 上一台</button>
      <button class="btn" id="chUp">▼ 下一台</button>
      <button class="btn" id="prev">◀ 上一个</button>
      <button class="btn" id="next">下一个 ▶</button>
      <button class="btn" id="pause">暂停 / 继续</button>
      <button class="btn" id="full">全屏</button>
      <button class="btn" id="block">不再播放这个</button>
    </div>
  </div>
    <div class="guide-wrap">
      <h2>节目表</h2>
      <div class="guide" id="guide"><p class="hint">正在读取各台的节目…</p></div>
      <p class="hint">时间是按视频长度估算的，广告会让实际时间往后推一些。点节目名就播那个节目。</p>
    </div>
</div>

<script>
{
// 频道表。all: true 表示播放全部上传（含直播回放、短视频）；否则只播普通长视频。
const BUILT_IN = [
  { name: "NBA 篮球",   sub: "NBA 官方",          id: "UCWJ2lWNubArHWmf3FIHbfcQ", all: false },
  { name: "羽毛球",     sub: "BWF TV 世界羽联",    id: "UChh-akEbUM8_6ghGVnJd6cQ", all: false },
  { name: "网球",       sub: "Tennis TV（ATP）",   id: "UCbcxFkd6B9xUU54InHv4Tig", all: false },
  { name: "奥运会",     sub: "Olympics 官方",      id: "UCTl3QQTvqHFjurroKxexy2Q", all: false },
  { name: "足球 / 世界杯", sub: "FIFA 官方",       id: "UCpcTrCXblq78GZrTUTLWeBw", all: false }
];

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

let custom = load("sportsTV.custom", []);
let channels = [];
let current = -1;        // 当前频道序号
let player = null;
let pending = null;      // 等待恢复的播放位置 {videoId, time}
let usingAll = false;    // 当前频道是否已退回到“全部上传”
let errorCount = 0;
let hasPlayed = false;   // 这次调台后是否已经放出过视频
let checkedNewest = false;  // 这次调台后是否已经检查过“有没有新视频”
let freshAvailable = false; // 后台检查发现了新视频，等当前视频播完就切过去
let lastVideoId = "";       // 正在播的视频 ID，用来判断是否换到了下一个视频
let blocked = load("sportsTV.blocked", []);  // 设为“不再播放”的视频 ID
let blockedSkips = 0;       // 连续跳过了几个“不再播放”的视频，防止全部被屏蔽时一直跳
const titles = load("sportsTV.titles", {});   // 视频标题缓存：视频 ID → 标题
const durations = load("sportsTV.dur", {});   // 视频时长缓存：视频 ID → 秒数（时长不会变，存下来下次直接用）
const guideLists = {};      // 各台的视频列表：频道 ID → [视频 ID, ...]

function buildChannels() {
  channels = [];
  for (let i = 0; i < BUILT_IN.length; i++) channels.push(BUILT_IN[i]);
  for (let i = 0; i < custom.length; i++) channels.push(custom[i]);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function renderList() {
  let html = "";
  for (let i = 0; i < channels.length; i++) {
    const c = channels[i];
    const isCustom = i >= BUILT_IN.length;
    html += '<button class="ch' + (i === current ? ' on' : '') + '" data-i="' + i + '">' +
      '<span class="num">' + (i + 1) + '</span>' +
      '<span><b>' + esc(c.name) + '</b><small>' + esc(c.sub || "") + '</small></span>' +
      (isCustom ? '<span class="del" data-del="' + i + '">删除</span>' : '') +
      '</button>';
  }
  document.getElementById("list").innerHTML = '<div style="display:grid;gap:12px">' + html + '</div>';
}

// 频道 ID 是 UC 开头；把 UC 换成 UU 是“全部上传”，换成 UULF 是“只要普通长视频”
function playlistId(c, all) {
  const rest = c.id.slice(2);
  return (all ? "UU" : "UULF") + rest;
}

// pickVideoId：从节目表里点了别的台的某个节目时，直接从那个节目开始
function tune(i, pickVideoId) {
  if (channels.length === 0) return;
  if (i < 0) i = channels.length - 1;
  if (i >= channels.length) i = 0;
  current = i;
  renderList();
  document.getElementById("msg").style.display = "none";
  const c = channels[i];
  usingAll = c.all;
  errorCount = 0;
  hasPlayed = false;
  checkedNewest = false;
  freshAvailable = false;
  lastVideoId = "";
  pending = pickVideoId ? { videoId: pickVideoId, time: 0 } : load("sportsTV.pos." + c.id, null);
  save("sportsTV.lastChannel", c.id);
  blockedSkips = 0;
  renderGuide();
  setNow("正在调台…（如果有广告，会先播广告）");
  makePlayer(playlistId(c, usingAll));
}

// 每次换台都拆掉旧播放器、新建一个。
// 不用 loadPlaylist：在同一个播放器里换列表时，列表内容不会真正换掉，还会继续放上一个台的视频。
function makePlayer(list) {
  if (player) {
    player.destroy();
    player = null;
  }
  let el = document.getElementById("player");
  if (!el) {
    el = document.createElement("div");
    el.id = "player";
    document.getElementById("screen").prepend(el);
  }
  player = new YT.Player("player", {
    playerVars: { listType: "playlist", list: list, autoplay: 1, rel: 0, playsinline: 1, loop: 1 },   // loop: 1 播完整个列表后从头再来
    events: { onStateChange: onState, onError: onError }
  });
}

function onState(e) {
  if (e.data !== YT.PlayerState.PLAYING) return;
  hasPlayed = true;
  errorCount = 0;
  const c = channels[current];
  const data = player.getVideoData();

  // 调台后第一次放出视频：看列表最前面是不是没见过的新视频
  if (!checkedNewest) {
    checkedNewest = true;
    const ids = player.getPlaylist() || [];
    if (ids.length > 0) {
      const known = load("sportsTV.newest." + c.id, null);
      const hasNew = known !== null && ids[0] !== known;
      if (hasNew && pending) {
        // 有新视频，但上次的视频还没看完：先接着看完，看完再切到最新的
        freshAvailable = true;
      } else {
        save("sportsTV.newest." + c.id, ids[0]);
      }
    }
  }

  // 已经换到下一个视频，而后台发现过新视频：重建播放器，从最新的开始播
  if (freshAvailable && !pending && lastVideoId !== "" && data.video_id !== lastVideoId) {
    freshAvailable = false;
    pending = null;
    hasPlayed = false;
    checkedNewest = false;
    lastVideoId = "";
    setNow("有新视频，正在切换到最新的…");
    makePlayer(playlistId(c, usingAll));
    return;
  }
  lastVideoId = data.video_id;

  if (pending) {
    if (data.video_id === pending.videoId) {
      if (pending.time > 5) player.seekTo(pending.time, true);
      pending = null;
    } else {
      const ids = player.getPlaylist() || [];
      let k = -1;
      for (let i = 0; i < ids.length; i++) {
        if (ids[i] === pending.videoId) { k = i; break; }
      }
      if (k === -1) {
        pending = null;
        if (freshAvailable) {
          freshAvailable = false;
          save("sportsTV.newest." + c.id, ids[0]);
        }
      } else {
        player.playVideoAt(k);
      }
    }
  }

  // 设为“不再播放”的视频：自动跳过
  if (!pending && isBlocked(data.video_id)) {
    blockedSkips = blockedSkips + 1;
    if (blockedSkips < 30) {
      setNow("跳过一个设为“不再播放”的视频…");
      player.nextVideo();
      return;
    }
  }
  blockedSkips = 0;

  if (data.title) titles[data.video_id] = data.title;
  setNow(data.title);
  renderGuide();
}

// 换视频时 YouTube 常常先插广告，广告期间不会触发“正在播放”，
// 所以每 2 秒检查一次：列表位置或播放状态变了，就刷新标题和节目表。
let shownIdx = -1;
let shownPlaying = false;
setInterval(function () {
  if (!player || !player.getPlaylistIndex || !player.getPlayerState || current < 0) return;
  const idx = player.getPlaylistIndex();
  const playingNow = player.getPlayerState() === YT.PlayerState.PLAYING;
  if (idx === shownIdx && playingNow === shownPlaying) return;
  shownIdx = idx;
  shownPlaying = playingNow;
  if (!playingNow) {
    const data = player.getVideoData();
    if (data && data.title) setNow("即将播放：" + data.title);
  }
  renderGuide();
}, 2000);

// 时间在走，红线和节目格子每 30 秒重画一次
setInterval(function () { renderGuide(); }, 30000);

function isBlocked(id) {
  for (let i = 0; i < blocked.length; i++) {
    if (blocked[i] === id) return true;
  }
  return false;
}

// ================= 节目表 =================
// 每一行是一个台，横轴是时间，格子宽度按视频时长。
// 当前正在看的台：按播放器的真实进度画；
// 其他台：画的是“现在调过去会看到什么”（有没看完的就从没看完的接着，否则从最新的开始）。

const GUIDE_BEFORE = 10 * 60;      // 红线左边显示 10 分钟
const GUIDE_SPAN = 150 * 60;       // 一共显示 2.5 小时
const DEFAULT_DUR = 10 * 60;       // 还不知道时长的视频，先按 10 分钟画

function twoDigits(n) { return n < 10 ? "0" + n : "" + n; }
function clockText(sec) {
  const d = new Date(sec * 1000);
  return twoDigits(d.getHours()) + ":" + twoDigits(d.getMinutes());
}

// 某个台从哪个视频、哪一秒开始算
function startPointFor(c, ids) {
  const pos = load("sportsTV.pos." + c.id, null);
  if (pos) {
    for (let k = 0; k < ids.length; k++) {
      if (ids[k] === pos.videoId) return { k: k, time: pos.time };
    }
  }
  return { k: 0, time: 0 };
}

// 算出某个台在时间窗口里的节目：[{k, id, start, end}]
function rowPrograms(i, winStart, winEnd, now) {
  const c = channels[i];
  let ids, k, begin;
  if (i === current && player && player.getPlaylist && player.getPlaylist()) {
    ids = player.getPlaylist();
    k = player.getPlaylistIndex();
    if (k < 0) k = 0;
    const playingNow = player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING;
    begin = playingNow ? now - player.getCurrentTime() : now;
  } else {
    ids = guideLists[c.id];
    if (!ids || ids.length === 0) return null;
    const sp = startPointFor(c, ids);
    k = sp.k;
    begin = now - sp.time;
  }
  const out = [];
  let t = begin;
  for (let step = 0; step < ids.length && t < winEnd && out.length < 40; step++) {
    const kk = (k + step) % ids.length;
    const id = ids[kk];
    if (isBlocked(id)) continue;
    let d = durations[id];
    if (!d && i === current && step === 0 && player.getDuration) d = Math.round(player.getDuration());
    if (!d) d = DEFAULT_DUR;
    out.push({ k: kk, id: id, start: t, end: t + d });
    t = t + d;
  }
  return out;
}

function renderGuide() {
  const box = document.getElementById("guide");
  const now = Date.now() / 1000;
  const winStart = now - GUIDE_BEFORE;
  const winEnd = winStart + GUIDE_SPAN;
  function pct(sec) { return ((sec - winStart) / GUIDE_SPAN * 100).toFixed(3) + "%"; }

  // 表头：当前时间 + 每半小时一个刻度
  let head = '<div class="g-row g-head"><div class="g-ch g-clock">' + clockText(now) + '</div><div class="g-track">';
  let tick = Math.ceil(winStart / 1800) * 1800;
  while (tick < winEnd) {
    head += '<div class="g-time" style="left:' + pct(tick) + '">' + clockText(tick) + '</div>';
    tick = tick + 1800;
  }
  head += '</div></div>';

  let rows = "";
  const missing = [];
  for (let i = 0; i < channels.length; i++) {
    const c = channels[i];
    rows += '<div class="g-row' + (i === current ? ' on' : '') + '">' +
      '<button class="g-ch" data-tune="' + i + '"><b>' + (i + 1) + '</b><span>' + esc(c.name) + '</span></button>' +
      '<div class="g-track">';
    const progs = rowPrograms(i, winStart, winEnd, now);
    if (!progs) {
      rows += '<div class="g-wait">正在读取节目…</div>';
    } else {
      for (let j = 0; j < progs.length; j++) {
        const p = progs[j];
        const left = Math.max(p.start, winStart);
        const right = Math.min(p.end, winEnd);
        if (right <= left) continue;
        const title = titles[p.id];
        if (title === undefined) missing.push(p.id);
        const isCur = p.start <= now && now < p.end;
        rows += '<button class="g-prog' + (isCur ? ' cur' : '') + '" data-ch="' + i + '" data-k="' + p.k + '" data-id="' + esc(p.id) + '"' +
          ' style="left:' + pct(left) + ';width:calc(' + pct(right) + ' - ' + pct(left) + ')"' +
          ' title="' + esc(title || "") + '">' + esc(title || "…") + '</button>';
      }
    }
    rows += '<div class="g-now" style="left:' + pct(now) + '"></div></div></div>';
  }
  box.innerHTML = '<div class="g-grid">' + head + rows + '</div>';
  loadTitles(missing);
}

// 向 YouTube 的公开接口要标题，拿到后刷新节目表，并存下来下次直接用
function loadTitles(ids) {
  if (ids.length === 0) return;
  let left = ids.length;
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    titles[id] = "";   // 先占位，避免重复请求
    fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { titles[id] = (j && j.title) ? j.title : "（无法读取标题）"; })
      .catch(function () { titles[id] = "（无法读取标题）"; })
      .then(function () {
        left = left - 1;
        if (left === 0) {
          save("sportsTV.titles", titles);
          renderGuide();
        }
      });
  }
}

function renderBlocked() {
  const box = document.getElementById("blockedInfo");
  if (blocked.length === 0) { box.innerHTML = ""; return; }
  box.innerHTML = '已设为不再播放：' + blocked.length + ' 个视频 <button class="linkbtn" id="unblock">全部恢复</button>';
  document.getElementById("unblock").onclick = function () {
    blocked = [];
    save("sportsTV.blocked", blocked);
    renderBlocked();
    renderGuide();
  };
}

// ---------- 后台读取各台的列表和视频时长 ----------
// 做法：建一个看不见、静音、不播放的小播放器，依次读取每个台的列表，
// 再把要画在节目表里的视频一个个“准备”（cue）一下，读出时长。
// 顺便检查当前台有没有新视频：有的话，等当前视频播完就切到最新的。
let guideBusy = false;

function refreshGuide() {
  if (guideBusy || !window.YT || !YT.Player) return;
  guideBusy = true;
  let i = 0;
  function nextChannel() {
    if (i >= channels.length) {
      guideBusy = false;
      renderGuide();
      return;
    }
    const c = channels[i];
    i = i + 1;
    probeChannel(c, function () {
      renderGuide();
      nextChannel();
    });
  }
  nextChannel();
}

function probeChannel(c, done) {
  let box = document.getElementById("probe");
  if (!box) {
    box = document.createElement("div");
    box.id = "probe";
    document.body.appendChild(box);
  }
  const isCurrent = current >= 0 && channels[current].id === c.id;
  const list = playlistId(c, isCurrent ? usingAll : c.all);
  let waiter = null;
  let finished = false;
  let tries = 0;

  const probe = new YT.Player("probe", {
    width: 1,
    height: 1,
    playerVars: { listType: "playlist", list: list, autoplay: 0, mute: 1 },
    events: {
      onReady: function () { waitForList(); },
      onStateChange: function (e) {
        if (e.data === YT.PlayerState.CUED && waiter) {
          const w = waiter;
          waiter = null;
          w();
        }
      }
    }
  });

  function finish() {
    if (finished) return;
    finished = true;
    try { probe.destroy(); } catch (e) {}
    done();
  }

  function waitForList() {
    const ids = probe.getPlaylist ? probe.getPlaylist() : null;
    if (ids && ids.length > 0) {
      guideLists[c.id] = ids;
      checkFresh(c, ids);
      const sp = startPointFor(c, ids);
      fillDurations(ids, sp.k, 0, 0);
    } else if (tries < 15) {
      tries = tries + 1;
      setTimeout(waitForList, 1000);
    } else {
      finish();
    }
  }

  // 从起点往后，凑够 3 小时或者看了 25 个视频就停
  function fillDurations(ids, k, count, total) {
    if (count >= 25 || total >= 3 * 3600) { finish(); return; }
    const id = ids[k % ids.length];
    if (isBlocked(id)) { fillDurations(ids, k + 1, count + 1, total); return; }
    if (durations[id]) { fillDurations(ids, k + 1, count + 1, total + durations[id]); return; }

    let called = false;
    function after() {
      if (called) return;
      called = true;
      waiter = null;
      setTimeout(function () {
        if (probe.getVideoData && probe.getVideoData().video_id === id) {
          const d = Math.round(probe.getDuration());
          if (d > 0) {
            durations[id] = d;
            save("sportsTV.dur", durations);
          }
        }
        fillDurations(ids, k + 1, count + 1, total + (durations[id] || DEFAULT_DUR));
      }, 300);
    }
    waiter = after;
    setTimeout(after, 5000);   // 5 秒还没准备好就跳过这个
    probe.cueVideoById(id);
  }
}

// 当前台的列表最前面变了，说明有新视频：等当前视频播完就切过去
function checkFresh(c, ids) {
  if (current < 0 || channels[current].id !== c.id) return;
  if (!hasPlayed || freshAvailable) return;
  const known = load("sportsTV.newest." + c.id, null);
  if (known !== null && ids[0] !== known) freshAvailable = true;
}

// YouTube 播放器的程序加载好以后，先读一遍节目表；之后每 10 分钟更新一次
window.onYouTubeIframeAPIReady = function () { refreshGuide(); };
setInterval(refreshGuide, 10 * 60 * 1000);

// 有些视频不允许在外部网页播放，或在本地区不能看：自动跳到下一个
function onError(e) {
  errorCount = errorCount + 1;
  // 这个台还一个视频都没放出来就报错，可能是“只播长视频”的列表不可用，改成全部上传再试
  if (!hasPlayed && !usingAll) {
    usingAll = true;
    makePlayer(playlistId(channels[current], true));
    return;
  }
  if (errorCount < 10) {
    setNow("这个视频不能在这里播放，跳到下一个…");
    player.nextVideo();
  } else {
    setNow("这个频道连续多个视频无法播放，请换一个台。");
  }
}

function setNow(text) {
  const name = current >= 0 ? channels[current].name : "";
  document.getElementById("now").innerHTML = '<span>' + esc(name) + '</span>' + esc(text || "");
}

// 每 5 秒记一次播放位置，下次回到这个台从这里接着看
setInterval(function () {
  if (!player || current < 0 || !player.getVideoData || !player.getPlayerState) return;
  if (!hasPlayed) return;   // 新台还没放出视频时不记录，免得把上一个台的位置记到这个台名下
  if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
  const data = player.getVideoData();
  if (!data || !data.video_id) return;
  save("sportsTV.pos." + channels[current].id, { videoId: data.video_id, time: Math.floor(player.getCurrentTime()) });
}, 5000);

function togglePause() {
  if (!player || !player.getPlayerState) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}

document.getElementById("list").addEventListener("click", function (e) {
  const del = e.target.closest("[data-del]");
  if (del) {
    const i = Number(del.dataset.del);
    custom.splice(i - BUILT_IN.length, 1);
    save("sportsTV.custom", custom);
    buildChannels();
    if (current === i) current = -1;
    renderList();
    return;
  }
  const btn = e.target.closest(".ch");
  if (btn) tune(Number(btn.dataset.i));
});

document.getElementById("chDown").onclick = function () { tune(current - 1); };
document.getElementById("chUp").onclick = function () { tune(current + 1); };
document.getElementById("prev").onclick = function () { if (player && player.previousVideo) player.previousVideo(); };
document.getElementById("next").onclick = function () { if (player && player.nextVideo) player.nextVideo(); };
document.getElementById("pause").onclick = togglePause;
document.getElementById("block").onclick = function () {
  if (!player || !player.getVideoData) return;
  const id = player.getVideoData().video_id;
  if (!id) return;
  if (!isBlocked(id)) blocked.push(id);
  save("sportsTV.blocked", blocked);
  renderBlocked();
  setNow("已设为不再播放，跳到下一个…");
  player.nextVideo();
};
document.getElementById("guide").addEventListener("click", function (e) {
  const chBtn = e.target.closest("[data-tune]");
  if (chBtn) { tune(Number(chBtn.dataset.tune)); return; }
  const item = e.target.closest(".g-prog");
  if (!item) return;
  const i = Number(item.dataset.ch);
  if (i === current && player && player.playVideoAt) {
    pending = null;
    freshAvailable = false;   // 自己选的节目，不要被“切到最新”打断
    player.playVideoAt(Number(item.dataset.k));
  } else {
    tune(i, item.dataset.id);
  }
});
document.getElementById("full").onclick = function () {
  const s = document.getElementById("screen");
  if (s.requestFullscreen) s.requestFullscreen().catch(function () {});
};

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowUp") { e.preventDefault(); tune(current - 1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); tune(current + 1); }
  else if (e.key === "ArrowLeft" && player && player.previousVideo) { e.preventDefault(); player.previousVideo(); }
  else if (e.key === "ArrowRight" && player && player.nextVideo) { e.preventDefault(); player.nextVideo(); }
  else if (e.key === " ") { e.preventDefault(); togglePause(); }
});

document.getElementById("addForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const name = document.getElementById("addName").value.trim();
  const id = document.getElementById("addId").value.trim();
  const msg = document.getElementById("addMsg");
  if (id.length !== 24 || id.slice(0, 2) !== "UC") {
    msg.textContent = "频道 ID 应该以 UC 开头，一共 24 个字符。";
    return;
  }
  custom.push({ name: name, sub: "自己添加", id: id, all: document.getElementById("addAll").checked });
  save("sportsTV.custom", custom);
  buildChannels();
  renderList();
  msg.textContent = "已添加：" + name;
  e.target.reset();
});

buildChannels();
renderList();
renderBlocked();
renderGuide();

// 打开网页时：如果上次看过某个台，显示“继续观看”大按钮。
// 浏览器一般不允许网页没被点击就自动带声音播放，所以需要点一下。
const lastId = load("sportsTV.lastChannel", null);
let lastIndex = -1;
for (let i = 0; i < channels.length; i++) {
  if (channels[i].id === lastId) { lastIndex = i; break; }
}
if (lastIndex >= 0) {
  const msgBox = document.getElementById("msg");
  msgBox.innerHTML = '<button class="resume" id="resume">▶ 继续观看：' + esc(channels[lastIndex].name) + '</button>';
  document.getElementById("resume").onclick = function () { tune(lastIndex); };
}
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
