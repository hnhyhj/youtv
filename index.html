<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体育电视</title>
<link rel="stylesheet" href="style.css?v=0.22">
</head>
<body>
<div class="wrap">
  <div class="side">
    <div>
      <h1>体育电视</h1>
      <p class="hint">点一个频道就开始播放。键盘：↑↓ 换台，←→ 上一个/下一个，空格 暂停。</p>
    </div>
    <div id="list"></div>
    <details>
      <summary>添加频道</summary>
      <form id="addForm">
        <input id="addName" placeholder="频道名，例如：WTA 网球" required>
        <input id="addId" placeholder="频道 ID，以 UC 开头，共 24 位" required>
        <label><input type="checkbox" id="addAll"> 包含直播回放和短视频</label>
        <button class="btn" type="submit">添加</button>
        <div class="hint">不知道频道 ID？把频道网址贴到
          <a href="https://channelsurfer.tv/tools/youtube-channel-id" target="_blank" rel="noopener">这个查询工具</a> 里就能查到。</div>
        <div class="hint" id="addMsg"></div>
      </form>
    </details>
    <div class="hint" id="blockedInfo"></div>
    <p class="hint ver">版本 v0.22 · 2026-11-27</p>
  </div>

  <div class="main">
    <div class="screen" id="screen">
      <div id="player"></div>
      <div class="msg" id="msg">选一个频道开始</div>
    </div>
    <div class="now" id="now"></div>
    <div class="bar">
      <button class="btn" id="chDown">▲ 上一台</button>
      <button class="btn" id="chUp">▼ 下一台</button>
      <button class="btn" id="prev">◀ 上一个</button>
      <button class="btn" id="next">下一个 ▶</button>
      <button class="btn" id="pause">暂停 / 继续</button>
      <button class="btn" id="full">全屏</button>
      <button class="btn" id="block">不再播放这个</button>
    </div>
  </div>
    <div class="guide-wrap">
      <h2 id="guideTitle">节目表</h2>
      <div class="guide" id="guide"></div>
      <p class="hint">时间是按视频长度估算的，广告会让实际时间往后推一些。点节目名就播那个节目。</p>
    </div>
</div>

<script src="app.js?v=0.22"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
