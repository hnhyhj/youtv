# 每日赛事列表：每 6 小时运行一次，生成 daily.json 和 mixes.json，有变化才提交
name: 每日赛事列表

on:
  schedule:
    - cron: "17 */6 * * *"     # UTC 每 6 小时，第 17 分钟（避开整点高峰）
  workflow_dispatch:            # 也可以在 GitHub 网页上手动运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 daily.json 和 mixes.json
        run: python scripts/build_daily.py

      - name: 有变化就提交
        run: |
          git config user.name "youtv-bot"
          git config user.email "youtv-bot@users.noreply.github.com"
          git add daily.json
          if [ -f mixes.json ]; then git add mixes.json; fi
          if git diff --cached --quiet; then
            echo "列表没有变化"
          else
            git commit -m "每日赛事列表 $(date -u +%Y-%m-%d)"
            git push
          fi
